<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu ecosistema digital · Reporte octubre 2026 · cuando quieras</title>
<meta name="theme-color" content="#F3F3EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #F6F7F9; }
a { color: inherit; }
button { font: inherit; }

/* ---------- Paletas ---------- */
.t-niebla{--bg:#F6F7F9;--panel:#FFFFFF;--surface:#FFFFFF;--surface2:#EEF0F4;--border:#E4E7EC;--text:#1A1D23;--muted:#5F6878;--faint:#B4BAC5;--accent:#4C5FD5;--onAccent:#FFFFFF;--accentSoft:rgba(76,95,213,0.08);--heroBg:#E8ECFF;--heroInk:#1E2A78;--blue:#8B9CFF;--coral:#F4A18A;--violet:#B9A6F7;--sand:#EBCB7E;--pos:#12805C;--neg:#C2412C;--posSoft:rgba(18,128,92,0.09);--negSoft:rgba(194,65,44,0.09);--grid:#EEF0F4;--ink:#1A1D23;--shadow:0 18px 40px -28px rgba(30,42,120,0.35)}
.t-lino{--bg:#F8F6F1;--panel:#FFFDF9;--surface:#FFFFFF;--surface2:#F2EEE6;--border:#E8E2D6;--text:#2A2622;--muted:#6E665B;--faint:#C2B9AB;--accent:#B9533A;--onAccent:#FFFFFF;--accentSoft:rgba(185,83,58,0.08);--heroBg:#F7E4D9;--heroInk:#5E2617;--blue:#9DB4D6;--coral:#EBB57A;--violet:#C3B3D9;--sand:#E2C384;--pos:#3D7A55;--neg:#B23A2A;--posSoft:rgba(61,122,85,0.10);--negSoft:rgba(178,58,42,0.09);--grid:#F0ECE4;--ink:#2A2622;--shadow:0 18px 40px -28px rgba(94,38,23,0.35)}
.t-marfil{--bg:#F4F3EF;--panel:#FBFAF7;--surface:#FFFFFF;--surface2:#EFEEE9;--border:#E3E1DA;--text:#15171A;--muted:#5F646B;--faint:#A3A7AD;--accent:#2B3CFF;--onAccent:#FFFFFF;--accentSoft:rgba(43,60,255,0.08);--heroBg:#E6E9FF;--heroInk:#17208F;--blue:#8C98FF;--coral:#F29A7E;--violet:#A994FF;--sand:#E3C27A;--pos:#0E8A5C;--neg:#D2462A;--posSoft:rgba(14,138,92,0.10);--negSoft:rgba(210,70,42,0.10);--grid:#ECEAE4;--ink:#15171A;--shadow:0 18px 40px -28px rgba(23,32,143,0.35)}
.t-grafito{--bg:#0E1012;--panel:#141719;--surface:#1A1D21;--surface2:#23272C;--border:#2C3137;--text:#F1F0EB;--muted:#9AA1A9;--faint:#5F666E;--accent:#D6FF5C;--onAccent:#101205;--accentSoft:rgba(214,255,92,0.12);--heroBg:#D6FF5C;--heroInk:#101205;--blue:#8AA8FF;--coral:#FF8B6A;--violet:#B79CFF;--sand:#E8D9B5;--pos:#7BE3A8;--neg:#FF7D6B;--posSoft:rgba(123,227,168,0.14);--negSoft:rgba(255,125,107,0.14);--grid:#24282D;--ink:#0E1012;--shadow:none}

/* ---------- Base ---------- */
.root { min-height: 100vh; background: var(--bg); color: var(--text); font-family: Geist, system-ui, sans-serif; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 28px; }
.serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
.mono { font-family: 'Geist Mono', ui-monospace, monospace; }
.lbl { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.acc { color: var(--accent); }
.ellipsis { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn:focus-visible, .pill:focus-visible, .chip:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Cabecera ---------- */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 10px 10px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand .mark { width: 40px; height: 40px; border-radius: 999px; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 18px; font-style: italic; overflow: hidden; }
.brand .mark img { width: 100%; height: 100%; object-fit: cover; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface2); }
.tab { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 500; transition: background .2s ease, color .2s ease; }
.tab .n { font-family: 'Geist Mono', monospace; font-size: 11px; opacity: 0.7; }
.tab .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--faint); }
.tab .dot.live { background: var(--pos); }
.tab[aria-pressed="true"] { background: var(--accent); color: var(--onAccent); }
.tab[aria-pressed="true"] .dot { background: var(--onAccent); }
.tools { display: flex; align-items: center; gap: 8px; position: relative; }
.pill { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; }
.iconbtn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.popover { position: absolute; top: calc(100% + 10px); right: 0; width: 380px; padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 24px 60px -24px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 14px; }
.popover .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.select { min-height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
.select.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accentSoft); }
.seg { display: flex; flex-wrap: wrap; padding: 3px; border-radius: 12px; background: var(--surface2); }
.seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

.cover { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: end; padding: 24px 4px 4px; }
.cover h1 { margin: 10px 0 0; font-size: 92px; line-height: 0.95; letter-spacing: -0.02em; }
.chcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chcard { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 20px; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--border); background: var(--surface); transition: transform .18s ease, border-color .18s ease; }
.chcard:hover { transform: translateY(-2px); }
.chcard[aria-pressed="true"] { border: 1.5px solid var(--accent); background: var(--accentSoft); }
.chcard svg { width: 100%; height: 30px; display: block; }

/* ---------- Hojas ---------- */
.intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 28px; border-top: 1px solid var(--border); }
.intro .big { font-family: 'Geist Mono', monospace; font-size: 64px; line-height: 0.8; color: var(--faint); letter-spacing: -0.04em; }
.intro h2 { margin: 0; font-size: 48px; line-height: 1; }
.status { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--surface2); color: var(--muted); }
.status .d { width: 7px; height: 7px; border-radius: 999px; background: var(--faint); }
.status.live { background: var(--posSoft); color: var(--pos); }
.status.live .d { background: var(--pos); }
.status.warn { background: var(--negSoft); color: var(--neg); }
.status.warn .d { background: var(--neg); }

.grid12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; box-shadow: var(--shadow); }
h3.serif { margin: 6px 0 0; font-size: 32px; line-height: 1.05; font-weight: 400; }
.hero { background: var(--heroBg); color: var(--heroInk); border-radius: 28px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 330px; position: relative; overflow: hidden; }
.hero .bignum { font-size: 120px; font-weight: 200; line-height: 0.85; letter-spacing: -0.06em; }
.hero .suffix { font-size: 68px; font-style: italic; letter-spacing: 0; }
.hero .sentence { margin-top: 14px; font-size: 24px; line-height: 1.2; max-width: 24ch; }
.hero .badge { align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--heroInk); color: var(--heroBg); font-size: 13px; font-weight: 600; position: relative; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.kpi .in { padding: 18px 18px 6px; display: flex; flex-direction: column; gap: 6px; }
.kpi .v { font-size: 28px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; }
.kpi svg { width: 100%; height: 50px; display: block; margin-top: auto; }
.delta { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.delta.pos { color: var(--pos); background: var(--posSoft); }
.delta.neg { color: var(--neg); background: var(--negSoft); }
.delta.neu { color: var(--muted); background: var(--surface2); }
.insight { padding: 14px 18px; border-radius: 16px; background: var(--accentSoft); font-size: 14px; line-height: 1.5; }
.insight.neg { background: var(--negSoft); }
.insight.pos { background: var(--posSoft); }
.insight .lbl { margin-right: 8px; color: var(--accent); }
.insight.neg .lbl { color: var(--neg); }
.insight.pos .lbl { color: var(--pos); }
.track { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.track > div { height: 100%; border-radius: inherit; }
.empty { padding: 18px; border-radius: 16px; background: var(--surface2); color: var(--muted); font-size: 14px; }
.tip { position: absolute; z-index: 5; min-width: 190px; padding: 10px 12px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 12px; pointer-events: none; box-shadow: 0 12px 32px rgba(0,0,0,0.2); }

/* Animación solo al entrar a una hoja */
.animate .rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.loading { opacity: 0.55; transition: opacity .2s ease; }
@media (prefers-reduced-motion: reduce) { .animate .rise { animation: none; } .chcard { transition: none; } html { scroll-behavior: auto; } }

@media (max-width: 1100px) {
  .cover { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid12 > * { grid-column: span 12 !important; }
}
@media (max-width: 640px) {
  .wrap { padding: 16px 14px 48px; }
  .topbar { border-radius: 24px; }
  .tabs { width: 100%; overflow-x: auto; }
  .tab { padding: 0 12px; }
  .cover h1 { font-size: 56px; }
  .chcards { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero .bignum { font-size: 84px; }
  .card { padding: 20px; }
  .popover { width: calc(100vw - 28px); right: -10px; }
}

/* ============================================================
   Marca "cuando quieras" (palette: "cuandoquieras")
   Tinta, papel y una sola señal verde. Esquinas rectas, líneas de tinta,
   sombra sólida y Space Grotesk / Inter / JetBrains Mono.
   ============================================================ */
.t-cq{--bg:#F3F3EF;--panel:#FFFFFF;--surface:#FFFFFF;--surface2:#E6E6E1;--border:#D9D9D3;--frame:#0B0B0C;--text:#0B0B0C;--muted:#5E5E5A;--faint:#B5B5AF;--accent:#00E07A;--onAccent:#0B0B0C;--accentSoft:rgba(0,224,122,0.16);--heroBg:#0B0B0C;--heroInk:#F3F3EF;--sig:#00E07A;--blue:#8A8A86;--coral:#C9C9C4;--violet:#D9D9D3;--sand:#E6E6E1;--pos:#0A7A45;--neg:#C93B28;--posSoft:rgba(0,224,122,0.16);--negSoft:rgba(201,59,40,0.10);--grid:#E6E6E1;--ink:#0B0B0C;--shadow:none}
.t-cqd{--bg:#0B0B0C;--panel:#141416;--surface:#18181A;--surface2:#2A2A2C;--border:#2E2E31;--frame:#3A3A3D;--text:#F3F3EF;--muted:#9A9A96;--faint:#5E5E5A;--accent:#00E07A;--onAccent:#0B0B0C;--accentSoft:rgba(0,224,122,0.14);--heroBg:#00E07A;--heroInk:#0B0B0C;--sig:#00E07A;--blue:#8A8A86;--coral:#C9C9C4;--violet:#5E5E5A;--sand:#D9D9D3;--pos:#00E07A;--neg:#FF6B57;--posSoft:rgba(0,224,122,0.14);--negSoft:rgba(255,107,87,0.14);--grid:#232325;--ink:#0B0B0C;--shadow:none}

.brand-cq { font-family: Inter, system-ui, sans-serif; overflow-x: hidden; }
.brand-cq .mono, .brand-cq .lbl { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.brand-cq .lbl { text-transform: none; letter-spacing: .03em; font-size: 12px; }
.brand-cq .serif, .brand-cq h1, .brand-cq h2, .brand-cq h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-style: normal; letter-spacing: -.05em; }
.brand-cq em, .brand-cq .serif em { font-style: normal; }
.brand-cq em.acc { color: var(--ink); background: var(--sig); padding: 0 .08em; }
.brand-cq .acc { color: var(--text); }
.brand-cq [style*="color:var(--accent)"] { color: var(--text) !important; }
.brand-cq .hero [style*="color:var(--accent)"] { color: inherit !important; }
.brand-cq [style*="font-weight:200"], .brand-cq [style*="font-weight:300"], .brand-cq .kpi .v, .brand-cq .hero .bignum { font-family: 'Space Grotesk', sans-serif; font-weight: 500 !important; letter-spacing: -.045em !important; }

/* Esquinas rectas: todo menos los puntos y círculos */
.brand-cq .topbar, .brand-cq .tabs, .brand-cq .tab, .brand-cq .pill, .brand-cq .iconbtn, .brand-cq .popover, .brand-cq .chip, .brand-cq .select, .brand-cq .seg, .brand-cq .seg button, .brand-cq .chcard, .brand-cq .card, .brand-cq .hero, .brand-cq .kpi, .brand-cq .insight, .brand-cq .empty, .brand-cq .track, .brand-cq .status, .brand-cq .delta, .brand-cq .tip, .brand-cq .badge, .brand-cq article, .brand-cq section { border-radius: 0 !important; }
.brand-cq [style*="border-radius"] { border-radius: 0 !important; }
.brand-cq [style*="border-radius:999px"][style*="width:"], .brand-cq [style*="border-radius:50%"], .brand-cq .dot, .brand-cq .status .d, .brand-cq .pulse i { border-radius: 50% !important; }
.brand-cq svg rect { rx: 0; }

/* Líneas de tinta */
.brand-cq .topbar, .brand-cq .card, .brand-cq .kpi, .brand-cq .chcard, .brand-cq article, .brand-cq .popover, .brand-cq .pill, .brand-cq .iconbtn { border: 2px solid var(--frame) !important; box-shadow: none; }
.brand-cq .hero { border: 2px solid var(--frame); }
.brand-cq .intro { border-top: 2px solid var(--frame); }
.brand-cq .foot { border-top: 2px solid var(--frame) !important; }

/* Sombra sólida verde: solo donde se actúa o se destaca */
.brand-cq .hero, .brand-cq .chcard[aria-pressed="true"] { box-shadow: 6px 6px 0 var(--sig) !important; }
.brand-cq .chcard[aria-pressed="true"] { background: var(--surface); transform: translate(-2px, -2px); }
.brand-cq .chcard:hover { transform: translate(-2px, -2px); }
.brand-cq .tab[aria-pressed="true"] { background: var(--sig); color: var(--ink); }
.brand-cq .tab[aria-pressed="true"] .dot { background: var(--ink); }
.brand-cq .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }

/* Cabecera: logotipo con el punto que late */
.brand-cq .topbar { position: sticky; top: 12px; }
.brand-cq .wm { display: inline-flex; align-items: flex-end; gap: 3px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; line-height: .9; letter-spacing: -.055em; color: var(--text); }
.brand-cq .pulse { position: relative; width: 7px; height: 7px; margin-bottom: 2px; display: inline-block; }
.brand-cq .pulse i { position: absolute; inset: 0; background: var(--sig); }
.brand-cq .pulse i:first-child { animation: cqping 1.8s cubic-bezier(0,0,.2,1) infinite; }
@keyframes cqping { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(2.8); opacity: 0; } }

/* Portada: el círculo verde cortado por el borde */
.brand-cq .cover { position: relative; isolation: isolate; overflow: hidden; margin: 0 -32px; padding: 56px 32px 40px; }
.brand-cq .cover::before { content: ""; position: absolute; z-index: -1; right: -170px; top: 36px; width: 540px; aspect-ratio: 1; border-radius: 50%; background: var(--sig); animation: cqbreath 6s ease-in-out infinite; }
@keyframes cqbreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.brand-cq .cover { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.brand-cq .cover h1 { font-size: 92px; line-height: .92; letter-spacing: -.06em; }
.brand-cq .cover h1 em.acc { display: inline-block; margin-top: .04em; }
.brand-cq .intro h2 { font-size: 56px; letter-spacing: -.055em; }
.brand-cq .card h3, .brand-cq h3.serif { font-size: 34px; letter-spacing: -.05em; }

/* Héroe en tinta con señal verde */
.brand-cq .hero .suffix { color: var(--sig); font-style: normal; font-family: 'Space Grotesk', sans-serif; }
.brand-cq .t-cqd .hero .suffix, .t-cqd.brand-cq .hero .suffix { color: var(--ink); }
.brand-cq .hero em { color: var(--sig); }
.t-cqd.brand-cq .hero em { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.brand-cq .hero .badge { background: var(--sig); color: var(--ink); }
.t-cqd.brand-cq .hero .badge { background: var(--ink); color: var(--sig); }

/* Gráficos: líneas en tinta, áreas y rellenos en verde */
.brand-cq path[stroke="var(--accent)"] { stroke: var(--text); }
.brand-cq .hero path { stroke: currentColor; }
.brand-cq text[fill="var(--accent)"] { fill: var(--text); }
.brand-cq .insight { border-left: 4px solid var(--sig); background: var(--surface2); }
.brand-cq .insight.neg { border-left-color: var(--neg); background: var(--negSoft); }
.brand-cq .insight .lbl, .brand-cq .insight.pos .lbl { color: var(--text); }
.brand-cq .status.live { background: var(--sig); color: var(--ink); }
.brand-cq .status.live .d { background: var(--ink); }
.brand-cq .delta.pos { color: var(--pos); }

/* Pie en tinta */
.brand-cq .foot { margin: 8px -32px -64px; padding: 36px 32px !important; background: #0B0B0C; color: #9A9A96 !important; font-family: 'JetBrains Mono', monospace; }
@media (max-width: 1100px) { .brand-cq .cover { grid-template-columns: 1fr; } .brand-cq .cover::before { top: auto; bottom: -220px; right: -180px; width: 460px; } }
@media (max-width: 640px) { .brand-cq .cover { margin: 0 -14px; padding: 36px 14px 32px; } .brand-cq .cover h1 { font-size: 54px; } .brand-cq .intro h2 { font-size: 40px; } .brand-cq .cover::before { width: 320px; bottom: -150px; right: -140px; } .brand-cq .foot { margin: 8px -14px -48px; padding: 28px 14px !important; } }
@media (prefers-reduced-motion: reduce) { .brand-cq .cover::before, .brand-cq .pulse i:first-child { animation: none; } }

</style>
</head>
<body>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Curva suave que pasa por cada punto sin inventar picos (interpolación monótona).
function curvePath(P) {
  if (P.length < 2) return '';
  const f = (n) => n.toFixed(1);
  if (P.length === 2) return `M${f(P[0][0])},${f(P[0][1])}L${f(P[1][0])},${f(P[1][1])}`;
  const n = P.length, dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = P[i + 1][0] - P[i][0]; m[i] = dx[i] ? (P[i + 1][1] - P[i][1]) / dx[i] : 0; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${f(P[0][0])},${f(P[0][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const h3 = dx[i] / 3;
    d += `C${f(P[i][0] + h3)},${f(P[i][1] + t[i] * h3)} ${f(P[i + 1][0] - h3)},${f(P[i + 1][1] - t[i + 1] * h3)} ${f(P[i + 1][0])},${f(P[i + 1][1])}`;
  }
  return d;
}
// Promedio móvil centrado: muestra la tendencia en las miniaturas sin el ruido diario.
function smoothVals(v, win) {
  if (!win || v.length < win * 3) return v;
  const k = Math.floor(win / 2);
  return v.map((x, i) => { if (x == null) return null; const w = v.slice(Math.max(0, i - k), i + k + 1).filter((y) => y != null); return w.reduce((a, b) => a + b, 0) / w.length; });
}
function sparkPts(vals, w, h, pad = 3, win = 3) {
  const v = smoothVals(vals.map((x) => (x == null || isNaN(x) ? null : Number(x))), win);
  const ok = v.filter((x) => x != null);
  if (ok.length < 2) return null;
  let lo = Math.min(...ok), hi = Math.max(...ok);
  const mean = Math.abs(ok.reduce((a, b) => a + b, 0) / ok.length) || 1;
  if ((hi - lo) / mean < 0.02) { lo -= mean; hi += mean; }
  const r = hi - lo || 1;
  const P = [];
  v.forEach((x, i) => { if (x != null) P.push([(i * w) / (v.length - 1), h - pad - ((x - lo) / r) * (h - 2 * pad)]); });
  const line = curvePath(P);
  return { line, area: `${line}L${P[P.length - 1][0].toFixed(1)},${h}L${P[0][0].toFixed(1)},${h}Z` };
}
function sparkSvg(vals, { w = 120, h = 34, stroke = 'var(--faint)', fill = 'rgba(127,127,127,0.08)', sw = 1.75, style = '', win = 3 } = {}) {

}

function ring(p, size, r, sw, color, inner) {
  const C = 2 * Math.PI * r, c = size / 2;
  return `<div style="position:relative;width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true" style="width:${size}px;height:${size}px;transform:rotate(-90deg)"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${sw}"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(clamp(p, 0, 1) * C).toFixed(1)} ${C.toFixed(1)}"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${inner}</div></div>`;
}
function donut(parts, size, r, sw, inner) {
  const C = 2 * Math.PI * r, c = size / 2, tot = sum(parts.map((p) => p[1])) || 1;
  let acc = 0, segs = '';
  for (const [, v, color] of parts) {

    if (f > 0) segs += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${Math.max(0.5, f * C - (parts.length > 1 ? 3 : 0)).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-acc * C).toFixed(1)}"/>`;
    acc += f;
  }
  return `<div style="position:relative;width:${size}px;height:${size}px;align-self:center"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true" style="width:${size}px;height:${size}px;transform:rotate(-90deg)"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${sw}"/>${segs}</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">${inner}</div></div>`;
}

let paidChart = null;
function paidDaily(d, r) {

  const rp = curvePath(days.map((x, i) => [X(i), Y(x.revenue)]));
  const pk = days.reduce((b, x, i) => ((x.revenue || 0) > (days[b].revenue || 0) ? i : b), 0);
  const notes = (CONFIG.paid?.[r.monthKey]?.annotations || []).map(([date, text]) => [days.findIndex((x) => x.date === date), text]).filter(([i]) => i >= 0).slice(0, 3);
  const noteHtml = notes.map(([i, text], k) => {
    const left = X(i) / 10, flip = left > 60;
    return `<div style="position:absolute;top:${k * 40}px;left:${left.toFixed(2)}%;transform:${flip ? 'translateX(calc(-100% - 8px))' : 'translateX(8px)'};padding:6px 10px;border-radius:10px;background:var(--text);color:var(--bg);font-size:12px;font-weight:500;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis"><span class="mono" style="opacity:.6">${esc(dayLabel(days[i].date).toUpperCase())}</span> · ${esc(text)}</div>`;
  }).join('');
  const noteLines = notes.map(([i]) => `<line x1="${X(i).toFixed(1)}" y1="20" x2="${X(i).toFixed(1)}" y2="300" stroke="var(--text)" stroke-dasharray="3 5" stroke-opacity="0.4"/>`).join('');
  const hits = days.map((x, i) => `<rect data-day="${i}" x="${(i * 1000) / n}" y="0" width="${1000 / n}" height="320" fill="transparent"/>`).join('');
  const ticks = [0, Math.round((n - 1) / 4), Math.round((n - 1) / 2), Math.round(((n - 1) * 3) / 4), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  paidChart = { days, n, X, Y };
  return card(12, head('Día a día', `Lo que invertimos ${em('y lo que volvió')}`, `<div style="display:flex;gap:18px;font-size:13px;color:var(--muted)">${legendDot('var(--faint)', 'Inversión')}${legendDot('var(--accent)', 'Ingresos', 'line')}</div>`) + `
    <div style="display:flex;gap:28px;align-items:stretch;flex-wrap:wrap">
      <div style="flex:1 1 560px;min-width:0;position:relative" id="paid-chart">
        <svg viewBox="0 0 1000 320" preserveAspectRatio="none" role="img" aria-label="Inversión e ingresos por día" style="width:100%;height:320px;display:block">
          <line x1="0" y1="20" x2="1000" y2="20" stroke="var(--grid)"/><line x1="0" y1="113" x2="1000" y2="113" stroke="var(--grid)"/><line x1="0" y1="206" x2="1000" y2="206" stroke="var(--grid)"/><line x1="0" y1="300" x2="1000" y2="300" stroke="var(--border)"/>
          ${bars}<path d="${rp}L${X(n - 1).toFixed(1)},300L${X(0).toFixed(1)},300Z" fill="var(--accentSoft)"/>
          <path d="${rp}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          ${noteLines}<line id="paid-cursor" x1="-10" y1="20" x2="-10" y2="300" stroke="var(--accent)" stroke-opacity="0.5" vector-effect="non-scaling-stroke"/>
          <g id="paid-hit">${hits}</g>
        </svg>
        <div style="position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:999px;background:var(--bg);border:3px solid var(--accent);box-sizing:border-box;pointer-events:none;left:${(X(pk) / 10).toFixed(2)}%;top:${((Y(days[pk].revenue) / 320) * 100).toFixed(2)}%"></div>
        ${noteHtml}<div id="paid-tip"></div>
        <div class="mono num" style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)">${ticks.map((i) => `<span>${esc(dayLabel(days[i].date).toUpperCase())}</span>`).join('')}</div>
      </div>
      <div style="flex:0 0 200px;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-left:28px;border-left:1px solid var(--border)">
        <div><div class="lbl">Mejor día</div><div class="num" style="font-size:30px;font-weight:300">${F.moneyShort(days[pk].revenue)}</div><div style="font-size:12px;color:var(--muted)">${esc(dayLabel(days[pk].date))} · ROAS ${F.x(days[pk].roas, 1)}</div></div>
        <div><div class="lbl">Inversión / día</div><div class="num" style="font-size:30px;font-weight:300">${F.moneyShort(sum(days.map((x) => x.spend)) / n)}</div></div>
        <div><div class="lbl">Ingresos / día</div><div class="num acc" style="font-size:30px;font-weight:300">${F.moneyShort(sum(days.map((x) => x.revenue)) / n)}</div></div>
      </div>
    </div>`);
}
function showTip(i) {
  const c = paidChart, box = document.getElementById('paid-tip');
  if (!c || !box || !c.days[i]) return;
  const x = c.days[i], left = c.X(i) / 10;
  box.className = 'tip';
  box.style.left = left + '%';
  box.style.top = '30px';
  box.style.transform = left > 60 ? 'translateX(calc(-100% - 12px))' : 'translateX(12px)';
  box.innerHTML = `<div class="mono" style="opacity:.7;margin-bottom:4px">${esc(dayLabel(x.date).toUpperCase())}</div>
    <div style="display:grid;grid-template-columns:auto auto;gap:2px 14px"><span>Inversión</span><b class="num" style="text-align:right">${F.money(x.spend)}</b><span>Ingresos</span><b class="num" style="text-align:right">${F.money(x.revenue)}</b><span>ROAS</span><b class="num" style="text-align:right">${F.x(x.roas)}</b><span>Compras</span><b class="num" style="text-align:right">${F.int(x.purchases)}</b></div>`;
  const cur = document.getElementById('paid-cursor');
  if (cur) { cur.setAttribute('x1', c.X(i)); cur.setAttribute('x2', c.X(i)); }
}
function hideTip() {
